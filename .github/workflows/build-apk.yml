name: Build Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Install pinned buildozer/cython (stable toolchain for kivy 2.3)
        run: pip install buildozer==1.5.0 cython==3.0.11

      - name: Build debug APK
        working-directory: mobile
        env:
          BUILDOZER_ANDROID_ACCEPT_LICENSE: "1"
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          yes | buildozer -v android debug || buildozer -v android debug

      - name: Rename APK
        run: |
          mkdir -p out
          cp mobile/bin/*.apk out/arabic-timer-debug.apk
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arabic-timer-apk
          path: out/arabic-timer-debug.apk
          if-no-files-found: error
